name: Android Build

on:
  push:
    branches: [ main, develop, terminal ]
    # Android only. Without this, a change under web/ triggered a full Gradle build: the
    # two clients share a repository, not a build, and a web edit should not be able to
    # turn the Android check red or spend the minutes.
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ main, develop, terminal ]
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare stable develop signing key
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal'
        shell: bash
        env:
          INDOONE_KEYSTORE_BASE64: ${{ secrets.INDOONE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$INDOONE_KEYSTORE_BASE64"
          printf '%s' "$INDOONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/indoone-develop.keystore"
          test -s "$RUNNER_TEMP/indoone-develop.keystore"
      - name: Print Android OAuth signing fingerprint
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal'
        shell: bash
        env:
          INDOONE_KEYSTORE_PATH: ${{ runner.temp }}/indoone-develop.keystore
          INDOONE_KEYSTORE_PASSWORD: ${{ secrets.INDOONE_KEYSTORE_PASSWORD }}
          INDOONE_KEY_ALIAS: ${{ secrets.INDOONE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$INDOONE_KEYSTORE_PASSWORD"
          test -n "$INDOONE_KEY_ALIAS"
          echo "Android package: com.indoone.authenticator"
          keytool -list -v \
            -keystore "$INDOONE_KEYSTORE_PATH" \
            -storepass "$INDOONE_KEYSTORE_PASSWORD" \
            -alias "$INDOONE_KEY_ALIAS" \
            | awk '/SHA1:/{print "Android signing SHA-1: " $2; found=1} END {if (!found) exit 1}'
      - name: Build the standalone legal pages
        shell: bash
        run: |
          set -euo pipefail
          # The web is the single source for the legal pages. The app carries a snapshot so a
          # phone with no network can still read the policy, and the app's WebView reads the
          # same generated page online. One script, one source, two outputs.
          python3 scripts/legal_pages.py

      - name: Assemble debug APK
        shell: bash
        env:
          INDOONE_KEYSTORE_PATH: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal') && format('{0}/indoone-develop.keystore', runner.temp) || '' }}
          INDOONE_KEYSTORE_PASSWORD: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal') && secrets.INDOONE_KEYSTORE_PASSWORD || '' }}
          INDOONE_KEY_ALIAS: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal') && secrets.INDOONE_KEY_ALIAS || '' }}
          INDOONE_KEY_PASSWORD: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/terminal') && secrets.INDOONE_KEY_PASSWORD || '' }}
          INDOONE_BACKEND_URL: ${{ github.ref == 'refs/heads/terminal' && 'https://52.62.244.79' || '' }}
          INDOONE_BUILD_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No debug APK found under android/build/outputs/apk/debug"
            echo "APK files produced anywhere under android/build/outputs:"
            find android/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Found APK: $apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: indoone-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish terminal APK release
        if: github.ref == 'refs/heads/terminal'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INDOONE_BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          apk="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_apk="$RUNNER_TEMP/indoone-terminal.apk"
          cp "$apk" "$release_apk"
          tag="terminal-build-${INDOONE_BUILD_VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$release_apk" --clobber
          else
            gh release create "$tag" "$release_apk" --target terminal --title "Indoone terminal build ${INDOONE_BUILD_VERSION_CODE}" --notes "Automated terminal APK build for Indoone."
          fi

          # The app decides whether an update exists by comparing its own versionCode with
          # web/update.json, which is what the Pages site serves. Nothing used to update that
          # file, so it sat at 28 while the builds were in the thousands: every installed app
          # believed it was newer than the published one and the update prompt never appeared.
          # Its download URL pointed at web/downloads/, a folder this repository has never had.
          #
          # So the build updates the manifest itself, from the values it just published.
          version_name="$(grep -oE 'versionName = "[^"]+"' android/build.gradle.kts | head -1 | cut -d'"' -f2)"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/indoone-terminal.apk"
          notes="Indoone ${version_name}. Build ${INDOONE_BUILD_VERSION_CODE} from the terminal branch."

          payload="$(jq -n --argjson code "$INDOONE_BUILD_VERSION_CODE" --arg name "$version_name" --arg url "$download_url" --arg notes "$notes" '{versionCode: $code, versionName: $name, downloadUrl: $url, notes: $notes}')"

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/web/update.json?ref=web" --jq .sha 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/web/update.json" \
              -f message="chore(web): publish update manifest for build ${INDOONE_BUILD_VERSION_CODE}" \
              -f content="$(printf '%s' "$payload" | base64 -w0)" \
              -f sha="$current_sha" \
              -f branch=web >/dev/null
            echo "Published web/update.json for build ${INDOONE_BUILD_VERSION_CODE}."
          else
            echo "web/update.json not found on the web branch; skipped the manifest update."
          fi

  sync-main-to-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main into develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop
