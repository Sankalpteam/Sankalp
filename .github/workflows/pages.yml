name: Deploy Indoone Web

on:
  # The web lives on main; terminal carries the app's test builds and its copy
  # of web/ is the old one. Deploying from terminal is why the live site kept
  # showing a navigation bar with Connect in it long after main had lost it.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "landing/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the web folder is publishable
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/update.json

      - name: Check the old mark is not being drawn
        shell: bash
        run: python3 scripts/check_brand.py

      - name: Build the standalone legal pages
        shell: bash
        run: |
          set -euo pipefail
          # Generated from web/menu/<slug>/index.html, which is the copy a person edits.
          python3 scripts/legal_pages.py

      - name: Build the published tree
        shell: bash
        run: |
          set -euo pipefail
          # site/ is what Pages serves: the landing page at the root, the app under /app/,
          # the four legal documents at /legal/ where the company site links to them.
          python3 scripts/build_site.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
