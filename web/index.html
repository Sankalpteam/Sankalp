  <title>Sankalp by Indo Workspace</title>

  <!-- What Google draws for this address, line by line.

       Line 1 is the site name, taken from og:site_name and the WebSite schema below, so it
       says "Sankalp". Line 2 is the address. Line 3 is the title tag, which names the
       company behind the app. Line 4 is the description, which says what the app does.

       Three lines, three jobs: the name, the maker, the work. Repeating "Sankalp" in all
       three is what makes a result read as machine-written. -->
  <link rel="canonical" href="https://sankalp.indoworkspace.in/app/" />
  <meta name="robots" content="noindex, follow" />

  <!-- The logo, as files.

       The mark was drawn by a script into an SVG at runtime, which is fine for a person
       looking at the page and invisible to a crawler: a search engine reads the HTML it is
       served, and it found no icon there, so it drew a grey globe beside our name. These are
       the same mark, rendered to the sizes Google and Bing actually ask for, and linked
       statically. Google wants a square that is a multiple of 48 - 48 and 96 are here, plus a
       512 for the knowledge panel and the organization logo in structured data. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sankalp" />
  <meta property="og:title" content="Sankalp by Indo Workspace" />
  <meta
    property="og:description"
    content="Ask in any of 22 Indian languages, keep your one-time passwords in one place, and let the assistant work with GitHub and Zoho Mail."
  />
  <meta property="og:url" content="https://sankalp.indoworkspace.in/" />
  <meta property="og:image" content="https://sankalp.indoworkspace.in/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Sankalp, assistant by Indo Workspace" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sankalp by Indo Workspace" />
  <meta
    name="twitter:description"
    content="Ask in any of 22 Indian languages, keep your one-time passwords in one place, and let the assistant work with GitHub and Zoho Mail."
  />
  <meta name="twitter:image" content="https://sankalp.indoworkspace.in/assets/og-image.png" />

  <!-- Two entities, not one. Indo Workspace is the company and lives at its own address;
       Sankalp is the app, is a SoftwareApplication, and names the company as its publisher.
       The company @id used to sit on this domain, which told a crawler that the company and
       the app were the same thing. The company logo is deliberately absent: the only artwork
       here is the app mark, and handing it over as the company logo is how the two get
       conflated again. Add it when there is a company logo to point at. -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://indoworkspace.in/#org",
      "name": "Indo Workspace",
      "url": "https://indoworkspace.in/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://sankalp.indoworkspace.in/assets/logo-1024.png",
        "width": 1024,
        "height": 1024
      }
    },
    {
      "@type": "WebSite",
      "@id": "https://sankalp.indoworkspace.in/#website",
      "name": "Sankalp",
      "url": "https://sankalp.indoworkspace.in/app/",
      "publisher": {
        "@id": "https://indoworkspace.in/#org"
      }
    },
    {
      "@type": "SoftwareApplication",
      "@id": "https://sankalp.indoworkspace.in/#app",
      "name": "Sankalp",
      "url": "https://sankalp.indoworkspace.in/app/",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Android, Web",
      "publisher": {
        "@id": "https://indoworkspace.in/#org"
      },
      "isPartOf": {
        "@id": "https://sankalp.indoworkspace.in/#website"
      },
      "description": "Sankalp answers in any of 22 Indian languages, keeps one-time passwords in one place, and works with GitHub and Zoho Mail.",
      "image": "https://sankalp.indoworkspace.in/assets/logo-1024.png"
    }
  ]
}
  </script>
  <!-- The one heading a crawler can read without running the app. The interface is built by
       JavaScript, so the served page had no h1 at all and there was nothing for a search
       result to take a heading from. The noscript line is for the crawler that does not run
       scripts either - the same two sentences a person would read in the description. -->
  <h1 class="visually-hidden">Sankalp — the assistant app by Indo Workspace</h1>
  <noscript>
    <p>
      Sankalp is an assistant app by Indo Workspace. It answers in 22 Indian languages, keeps
      your one-time passwords in one place, and works with GitHub and Zoho Mail.
    </p>
  </noscript>
