<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in · Sankalp</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://sankalp.indoworkspace.in/app/">
<script>
  // Sankalp's sign-in screen is part of the app, not a separate document - one app, one set of
  // session and OTP code. This address exists so a person can link to it, and it opens the app
  // already on the sign-in screen.
  location.replace('/app/?screen=login');
</script>
<meta http-equiv="refresh" content="0; url=/app/?screen=login">
</head>
<body>
<p>Sign in to <a href="/app/?screen=login">Sankalp</a>.</p>
</body>
</html>
