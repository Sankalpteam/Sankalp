<section
  class="accounts-page"
  data-feature="accounts-list"
>
  <div class="accounts-head">
    <button
      type="button"
      class="accounts-back"
      data-close
      aria-label="Back"
    >
      ‹
    </button>

    <h2>Your accounts</h2>

    <button
      type="button"
      class="accounts-sort"
      id="accountsSort"
      aria-label="Sort accounts"
    >
      Sort ↕
    </button>
  </div>

  <div class="accounts-search">
    <input
      type="search"
      id="accountsSearch"
      placeholder="Search accounts"
      autocomplete="off"
      aria-label="Search accounts"
    />
  </div>

  <div
    class="accounts-list"
    id="accountsList"
    aria-live="polite"
  ></div>

  <div
    class="accounts-empty"
    id="accountsEmpty"
    hidden
  >
    <div class="accounts-empty-mark" aria-hidden="true">+</div>
    <p class="accounts-empty-title">No accounts found</p>
    <p class="accounts-empty-note">Add an account or try a different search.</p>
    <button
      type="button"
      class="accounts-empty-add"
      id="accountsEmptyAdd"
    >
      Add account
    </button>
  </div>
</section>
